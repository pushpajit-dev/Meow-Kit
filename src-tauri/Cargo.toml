[package]
name = "meowkit"
version = "1.2.0"
description = "Meow Kit — Ai powered Media Studio"
authors = ["NoishiXzen <noishixzen@gmail.com>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
